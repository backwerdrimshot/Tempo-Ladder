<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pulse Pocket</title>
  <desc id="desc">One ring with a single accent nub on it</desc>
  <!-- Timing family: Ink ground. One ring, not four — the outer three of the
       shipped icon merge into a single blur below about 64px. The Terra nub is
       the shared shop accent, the same solid dot that sits on the arm of the
       rimshot mark in the favicon. -->
  <rect width="1024" height="1024" fill="#171717"/>
  <circle cx="512" cy="512" r="280" fill="none" stroke="#fafaf9" stroke-width="84"/>
  <circle cx="512" cy="232" r="76" fill="#e2725b"/>
</svg>
