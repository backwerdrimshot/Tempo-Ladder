<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Tempo Ladder</title>
  <desc id="desc">A ladder with three rungs, the top one in the accent</desc>
  <!-- Timing family: Ink ground. An actual ladder rather than rising bars.
       Rising bars were doing two jobs badly: they read as a generic signal-
       strength meter, and at 56px they were the icon most easily confused with
       Scale Trail, which is in a different family and also means "ascending".
       A ladder is the app's own name and collides with nothing. -->
  <rect width="1024" height="1024" fill="#171717"/>
  <g fill="#fafaf9">
    <rect x="296" y="250" width="72" height="524" rx="36"/>
    <rect x="656" y="250" width="72" height="524" rx="36"/>
    <rect x="296" y="638" width="432" height="72" rx="36"/>
    <rect x="296" y="476" width="432" height="72" rx="36"/>
  </g>
  <!-- The rung being worked toward. -->
  <rect x="296" y="314" width="432" height="72" rx="36" fill="#e2725b"/>
</svg>
