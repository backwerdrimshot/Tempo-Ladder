name: Deploy to Cloudflare Workers

# A merge to main publishes. Until 2026-08-01 this workflow was
# workflow_dispatch-only, so merging changed nothing on the live origin unless
# somebody remembered to come back and press the button — and the sibling
# pages.yml *did* run on push, which made every merge look like it had
# deployed. Both this app and its sibling sat a release behind main for hours
# with every check green, and it was only caught by reading the build
# identifier back off the origin.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-workers-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm check
      - name: Deploy static assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
