<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#171717" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="canonical" href="https://pulse.backwerdrhythmshop.com/" />
<title>Moved to Pulse Pocket Metronome</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fafaf9;color:#171717;
    font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:34rem;padding:24px 16px}
  h1{font-size:1.4rem;line-height:1.25;margin:0 0 .5em}
  a{color:inherit;font-weight:600}
  @media (prefers-color-scheme: dark){ body{background:#171717;color:#fafaf9} }
</style>
</head>
<body>
<main>
  <h1>This practice tool has moved into Pulse Pocket Metronome.</h1>
  <p>Its slow–fast–slow climb is now Pulse Pocket's tempo ramp: turn on Practice Tools,
    choose <strong>Come back, then stop</strong>, and switch on
    <strong>Rest bar before each tempo</strong>.</p>
  <p><a id="go" href="https://pulse.backwerdrhythmshop.com/">Open Pulse Pocket Metronome →</a></p>
</main>
<script>
/* This address used to serve a standalone slow-fast-slow tempo app. It was
   retired on 2026-10-01 and folded into Pulse Pocket's tempo ramp. Old links
   and home-screen icons land here, and are sent on with the same climb:

     ?start=60&peak=100&step=5&measures=8&mode=step&label=Line%204
       -> https://pulse.backwerdrhythmshop.com/?name=Line%204&meter=4/4&bpm=60
          &ramp=100&rampstep=5&rampbars=8&rampend=back&rest=on

   As the old app did: built-in defaults < the settings this browser last
   used here < a link, field by field, so an unreadable value leaves the
   previous layer's. Step mode's reset measure is a rest bar; Nonstop has
   none. The old app was 4/4 only. */
var PULSE_POCKET = "https://pulse.backwerdrhythmshop.com/";
var STORE_KEY = "tempoladder-settings";

function toInt(v, lo, hi) {
  if (v === null || v === undefined || String(v).trim() === "") return null;
  var n = Math.round(+v);
  if (!isFinite(n)) return null;
  return Math.max(lo, Math.min(hi, n));
}

function cleanLabel(v) {
  return String(v).replace(/[\u0000-\u001F\u007F]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40);
}

function layer(s, raw) {
  if (!raw || typeof raw !== "object") return s;
  var n;
  if ((n = toInt(raw.startBpm, 30, 300)) !== null) s.startBpm = n;
  if ((n = toInt(raw.peakBpm, 30, 300)) !== null) s.peakBpm = n;
  if ((n = toInt(raw.stepBpm, 1, 30)) !== null) s.stepBpm = n;
  if ([4, 8, 16].indexOf(+raw.measuresPerTempo) !== -1) s.measuresPerTempo = +raw.measuresPerTempo;
  if (raw.mode === "step" || raw.mode === "nonstop") s.mode = raw.mode;
  if (raw.label !== null && raw.label !== undefined) s.label = cleanLabel(raw.label);
  return s;
}

/* The Pulse Pocket address for an old link's query and this browser's
   remembered settings (the parsed JSON, or null). */
function pulseUrl(search, stored) {
  var s = { startBpm: 60, peakBpm: 100, stepBpm: 5, measuresPerTempo: 8, mode: "step", label: "" };
  layer(s, stored);
  var q = new URLSearchParams(search || "");
  var names = { startBpm: "start", peakBpm: "peak", stepBpm: "step", measuresPerTempo: "measures", mode: "mode", label: "label" };
  var raw = {};
  for (var key in names) if (q.has(names[key])) raw[key] = q.get(names[key]);
  layer(s, raw);
  return PULSE_POCKET + "?" + (s.label ? "name=" + encodeURIComponent(s.label) + "&" : "")
    + "meter=4/4&bpm=" + s.startBpm
    + "&ramp=" + s.peakBpm + "&rampstep=" + s.stepBpm + "&rampbars=" + s.measuresPerTempo
    + "&rampend=back&rest=" + (s.mode === "step" ? "on" : "off");
}

(function forward() {
  if (typeof document === "undefined") return;   // loaded by the tests
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  var url = pulseUrl(location.search, stored);
  document.getElementById("go").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
